[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tris-market-event-intelligence"
version = "0.1.0"
description = "Local-first financial news event intelligence service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
market-event-api = "tris_market_event_intelligence.__main__:main"
market-event-collect = "tris_market_event_intelligence.collect_cli:main"
market-event-extract = "tris_market_event_intelligence.events_cli:main"
market-event-analyze = "tris_market_event_intelligence.impact_cli:main"
market-event-discover = "tris_market_event_intelligence.discovery_cli:main"
market-event-claims = "tris_market_event_intelligence.claims_cli:main"
market-event-scrape = "tris_market_event_intelligence.scrape_cli:main"
market-event-review = "tris_market_event_intelligence.review_cli:main"
market-event-evaluate = "tris_market_event_intelligence.evaluate_cli:main"
market-event-quality = "tris_market_event_intelligence.quality_cli:main"
market-event-cycle = "tris_market_event_intelligence.cycle_cli:main"
market-event-launchd = "tris_market_event_intelligence.launchd_config:main"
market-event-doctor = "tris_market_event_intelligence.operational_diagnostics:main"
market-event-api-launchd = "tris_market_event_intelligence.api_launchd_config:main"
market-event-api-local = "tris_market_event_intelligence.api_service:main"
market-event-runtime-audit = "tris_market_event_intelligence.runtime_audit:main"
market-event-bridge = "tris_market_event_intelligence.claim_bridge_cli:main"
market-event-impact-audit = "tris_market_event_intelligence.impact_review_cli:main"
market-event-impact-coverage = "tris_market_event_intelligence.impact_coverage_cli:main"
market-event-pilot-report = "tris_market_event_intelligence.impact_pilot_report_cli:main"
market-event-study = "tris_market_event_intelligence.event_study_cli:main"
market-event-krx-readiness = "tris_market_event_intelligence.krx_snapshot_cli:main"
market-event-intraday-study = "tris_market_event_intelligence.intraday_event_study_cli:main"
market-event-cpu-baseline = "tris_market_event_intelligence.cpu_baseline_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tris_market_event_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
