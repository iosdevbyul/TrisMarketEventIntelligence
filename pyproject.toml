[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "tris-market-event-intelligence"
version = "0.1.0"
description = "Local-first financial news event intelligence service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[project.scripts]
market-event-api = "tris_market_event_intelligence.__main__:main"
market-event-collect = "tris_market_event_intelligence.collect_cli:main"
market-event-extract = "tris_market_event_intelligence.events_cli:main"
market-event-analyze = "tris_market_event_intelligence.impact_cli:main"
market-event-discover = "tris_market_event_intelligence.discovery_cli:main"
market-event-claims = "tris_market_event_intelligence.claims_cli:main"
market-event-scrape = "tris_market_event_intelligence.scrape_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tris_market_event_intelligence"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
